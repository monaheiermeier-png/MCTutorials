<!DOCTYPE html>
<html>
<head>
    <title>Farms - MCTutorials</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <h1>🌾 Farms</h1>
    <p>Useful and automatic Minecraft farms</p>
</header>

<nav>

    <div class="nav-left">

        <a href="/">Home</a>
        <a href="/redstone">Redstone</a>
        <a href="/buildings">Buildings</a>
        <a href="/farms">Farms</a>

    </div>


    <div class="nav-right">

        {% if session.get("username") %}

            <span class="username">
                👤 {{ session["username"] }}
            </span>

            <a href="/logout" class="login-button">
                LOGOUT
            </a>

        {% else %}

            <a href="/login" class="login-button">
                LOGIN
            </a>

            <a href="/signup" class="signup-button">
                SIGN UP
            </a>

        {% endif %}

    </div>

</nav>

<main>
    <h2>Farm Tutorials</h2>
    <p>Learn how to build automatic farms for resources, food and other useful items.</p>
</main>

<footer>
    <p>© 2026 MCTutorials</p>
</footer>

</body>
</html>
