<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}MCTutorials{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <header>

        <h1>⛏️ MCTutorials</h1>

        <p>Your Minecraft Tutorials</p>

    </header>


    <!-- NAVIGATION -->

    <nav>

        <div class="nav-left">

            <a href="/">Home</a>
            <a href="/redstone">Redstone</a>
            <a href="/buildings">Buildings</a>
            <a href="/farms">Farms</a>

        </div>


        <div class="nav-right">

            {% if session.get("username") %}

                <a href="/profile" class="profile-link">

                    <img
                        src="{{ url_for('static', filename='profile_pictures/' + current_profile_picture) }}"
                        alt="Profile"
                        class="nav-profile-picture"
                    >

                    <span class="username">
                        {{ current_username }}
                    </span>

                </a>

                <a href="/logout" class="login-button">
                    LOGOUT
                </a>

            {% else %}

                <a href="/login" class="login-button">
                    LOGIN
                </a>

                <a href="/signup" class="signup-button">
                    SIGN UP
                </a>

            {% endif %}

        </div>

    </nav>


    <!-- SEITENINHALT -->

    {% block content %}

    {% endblock %}


    <footer>

        <p>© 2026 MCTutorials</p>

    </footer>

</body>

</html>
