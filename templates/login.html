{% extends "base.html" %}

{% block title %}
Login - MCTutorials
{% endblock %}


{% block content %}

<main>

    <div class="signup-container">

        <h1>Login</h1>

        <form method="POST" action="/login">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p style="margin-top: 20px;">
            Don't have an account?
            <a href="/signup">Sign Up</a>
        </p>

    </div>

</main>

{% endblock %}
