<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - MCTutorials</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- HEADER -->

    <header>
        <h1>⛏️ MCTutorials</h1>
        <p>Your Minecraft Tutorials</p>
    </header>


    <!-- NAVIGATION -->

  <nav>

    <div class="nav-left">

        <a href="/">Home</a>
        <a href="/redstone">Redstone</a>
        <a href="/buildings">Buildings</a>
        <a href="/farms">Farms</a>

    </div>


    <div class="nav-right">

        {% if session.get("username") %}

            <span class="username">
                👤 {{ session["username"] }}
            </span>

            <a href="/logout" class="login-button">
                LOGOUT
            </a>

        {% else %}

            <a href="/login" class="login-button">
                LOGIN
            </a>

            <a href="/signup" class="signup-button">
                SIGN UP
            </a>

        {% endif %}

    </div>

</nav>


    <!-- LOGIN -->

    <main>

        <div class="signup-container">

            <h1>Login</h1>

            <form method="POST" action="/login">

                <input
                    type="text"
                    name="username"
                    placeholder="Username"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p style="margin-top: 20px;">
                Don't have an account?
                <a href="/signup">Sign Up</a>
            </p>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>
        <p>© 2026 MCTutorials</p>
    </footer>

</body>

</html>
