<!DOCTYPE html>
<html lang="en">

<nav>

    <div class="nav-left">

        <a href="/">Home</a>
        <a href="/redstone">Redstone</a>
        <a href="/buildings">Buildings</a>
        <a href="/farms">Farms</a>

    </div>


    <div class="nav-right">

        {% if session.get("username") %}

            <span class="username">
                👤 {{ session["username"] }}
            </span>

            <a href="/logout" class="login-button">
                LOGOUT
            </a>

        {% else %}

            <a href="/login" class="login-button">
                LOGIN
            </a>

            <a href="/signup" class="signup-button">
                SIGN UP
            </a>

        {% endif %}

    </div>

</nav>


<body>

    <!-- =========================
         HEADER
         ========================= -->

    <header>

        <h1>⛏️ MCTutorials</h1>

        <p>Your Minecraft Tutorials</p>

    </header>


    <!-- =========================
         NAVIGATION
         ========================= -->

    <nav>

        <div class="nav-left">

            <a href="/">Home</a>

            <a href="/redstone">Redstone</a>

            <a href="/buildings">Buildings</a>

            <a href="/farms">Farms</a>

        </div>


        <a href="/signup" class="signup-button">
            SIGN UP
        </a>

    </nav>


    <!-- =========================
         SIGN UP FORM
         ========================= -->

    <main>

        <div class="signup-container">

            <h1>Create an Account</h1>

            <form method="POST" action="/signup">

                <input
                    type="text"
                    name="username"
                    placeholder="Username"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Sign Up
                </button>

            </form>

        </div>

    </main>


    <!-- =========================
         FOOTER
         ========================= -->

    <footer>

        <p>© 2026 MCTutorials</p>

    </footer>

</body>

</html>
