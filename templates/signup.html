{% extends "base.html" %}

{% block title %}
Sign Up - MCTutorials
{% endblock %}


{% block content %}

<main>

    <div class="signup-container">

        <h1>Create an Account</h1>

        <form method="POST" action="/signup">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Sign Up
            </button>

        </form>

        <p style="margin-top: 20px;">
            Already have an account?
            <a href="/login">Login</a>
        </p>

    </div>

</main>

{% endblock %}
