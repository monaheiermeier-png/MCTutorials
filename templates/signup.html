<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - MCTutorials</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <!-- =========================
         HEADER
         ========================= -->

    <header>

        <h1>⛏️ MCTutorials</h1>

        <p>Your Minecraft Tutorials</p>

    </header>


    <!-- =========================
         NAVIGATION
         ========================= -->

    <nav>

        <div class="nav-left">

            <a href="/">Home</a>

            <a href="/redstone">Redstone</a>

            <a href="/buildings">Buildings</a>

            <a href="/farms">Farms</a>

        </div>


        <a href="/signup" class="signup-button">
            SIGN UP
        </a>

    </nav>


    <!-- =========================
         SIGN UP FORM
         ========================= -->

    <main>

        <div class="signup-container">

            <h1>Create an Account</h1>

            <form method="POST" action="/signup">

                <input
                    type="text"
                    name="username"
                    placeholder="Username"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Sign Up
                </button>

            </form>

        </div>

    </main>


    <!-- =========================
         FOOTER
         ========================= -->

    <footer>

        <p>© 2026 MCTutorials</p>

    </footer>

</body>

</html>
